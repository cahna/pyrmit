name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-draft:
    name: Skip for draft PRs
    runs-on: ubuntu-latest
    steps:
      - name: Fail for draft PRs
        if: github.event.pull_request.draft == true
        run: |
          echo "Failing to prevent draft PRs from running the workflow."
          exit 1
      - run: echo "This is not a draft PR. Proceeding with the workflow."
  
  lint-actions:
    name: Lint Github Actions
    runs-on: ubuntu-latest
    needs: check-draft
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
  
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: check-draft
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: check-draft
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format --check)
        run: uv run ruff format --check

      - name: Type check (mypy --strict)
        run: uv run mypy src tests examples

      - name: Dependency hygiene (deptry)
        run: uv run deptry .

      - name: Test
        run: uv run pytest -q --cov=pyrmit --cov-report=term --cov-fail-under=90
