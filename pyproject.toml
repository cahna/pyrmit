[project]
name = "pyrmit"
version = "0.2.0"
description = "Typed, fail-closed authorization engine for Python 3.12+ with optional Strawberry, FastAPI, and SQLAlchemy adapters."
readme = "README.md"
authors = [
    { name = "Conor Heine", email = "conor.heine@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "authorization",
    "authz",
    "rbac",
    "policy",
    "permissions",
    "security",
    "strawberry",
    "fastapi",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.4; python_version < '3.13'",
    "uuid-utils>=0.10; python_version < '3.14'",
]

[project.optional-dependencies]
strawberry = [
    "graphql-core>=3.2",  # used directly by the Strawberry adapter (OperationType)
    "strawberry-graphql>=0.220",
]
fastapi = ["fastapi>=0.110"]
sqlalchemy = ["sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/cahna/pyrmit"
Repository = "https://github.com/cahna/pyrmit"
Issues = "https://github.com/cahna/pyrmit/issues"
Changelog = "https://github.com/cahna/pyrmit/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/pyrmit",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyrmit"]

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "commitizen>=4.16.2",
    "coverage>=7.14.0",
    "deptry>=0.25.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "hypothesis>=6.110",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-json-ctrf>=0.5.0",
    "ruff>=0.15.13",
    "sqlalchemy>=2.0",
    "strawberry-graphql>=0.220",
    "types-assertpy>=1.1.0.20260508",
]

[tool.ruff]
line-length = 120
extend-exclude = ["specs", "docs", "*.md"]
preview = true

[tool.ruff.lint]
select = ["B", "C", "D", "E", "F", "I", "N", "UP", "W", "FBT001", "FBT002", "FBT003"]
# UP enables pyupgrade rules; UP040/UP046/UP047 enforce PEP 695 generic syntax
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class
    "D212", # Multi-line docstring summary should start at the first line
]

[tool.ruff.lint.pylint]
max-positional-args = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D", # Ignore all docstring warnings in tests
    "FBT", # Boolean arguments are common in test fixtures and protocols
]
"tests/unit/core/test_errors.py" = ["N802"]
"tests/unit/core/test_logging_setup.py" = ["N802"]
"examples/*" = ["D"]  # Examples are illustrative; skip docstring rules.

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.deptry]
known_first_party = ["pyrmit"]
exclude = ["examples/.*", "tests/.*", ".venv/.*"]

[tool.deptry.per_rule_ignores]
# `httpx` is a dev dep used only by examples and integration tests.
DEP004 = ["httpx"]

[tool.mypy]
python_version = "3.12"
plugins = ["strawberry.ext.mypy_plugin"]
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_decorators = true
exclude = ["dist", "build", ".venv", "tests/typing/fixtures"]

[[tool.mypy.overrides]]
module = [
    "pyrmit.adapters.strawberry.*",
    "pyrmit.adapters.fastapi.*",
    "pyrmit.adapters.sqlalchemy.*",
    "pyrmit.core.lazy",  # Lazy[T] is a pyrmit-core-side sentinel for bridging to framework-Any contexts
]
disallow_any_explicit = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "tests.integration.strawberry.*",
    "tests.unit.adapters.strawberry.*",
    "tests.security.*",
    "examples.strawberry_graphql.*",
    "examples.fastapi.*",
    "examples.sqlalchemy.*",
]
disallow_any_explicit = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks performance benchmarks (deselect with '-m \"not benchmark\"')",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
